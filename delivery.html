<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7FAF8">
<meta name="robots" content="noindex">
<title>Your Files — The Ocultt Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=192">
<style>
  .delivery-wrap{max-width:640px;margin:0 auto;padding:2.5rem 1.5rem 1rem}
  .delivery-h1{font-family:Georgia,'Times New Roman',serif;font-size:1.9rem;line-height:1.25;color:var(--text);margin:0 0 0.6rem;text-align:center}
  .delivery-expiry{font-family:'Montserrat',sans-serif;font-size:0.85rem;color:var(--text-dim);margin:0 0 2.2rem;text-align:center}
  .delivery-expiry strong{color:var(--gold-dk)}
  .delivery-file{border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1.1rem;background:#fff}
  .delivery-file-label{font-family:'Montserrat',sans-serif;font-weight:600;font-size:0.95rem;color:var(--text);margin:0 0 0.7rem}
  .delivery-file video, .delivery-file audio{width:100%;display:block;border-radius:8px}
  .delivery-file img{width:100%;display:block;border-radius:8px}
  .delivery-file a.doc-link{display:inline-block;font-family:'Montserrat',sans-serif;font-weight:600;font-size:0.9rem;color:#fff;background:var(--gold-dk);border-radius:999px;padding:0.7rem 1.6rem;text-decoration:none}
  .delivery-state{text-align:center;padding:3rem 1.5rem;font-family:'Montserrat',sans-serif;color:var(--text-dim)}
  .delivery-state h2{font-family:Georgia,'Times New Roman',serif;color:var(--text);margin-bottom:0.6rem}
  @media(max-width:600px){
    .delivery-wrap{padding:1.8rem 1.1rem 0.5rem}
    .delivery-h1{font-size:1.5rem}
  }
</style>
</head>
<body>
<header class="legal-header">
  <a href="/" onclick="window.location.href='/'; return false;"><img class="legal-logo" src="/images/logo.png" alt="The Ocultt Tarot logo" onclick="window.location.href='/'"></a>
  <a class="legal-back" href="/">← Back to The Ocultt Tarot</a>
</header>
<main class="delivery-wrap">
  <div id="delivery-loading" class="delivery-state">
    <h2>Loading your files&hellip;</h2>
  </div>
  <div id="delivery-content" style="display:none">
    <h1 class="delivery-h1" id="delivery-title">Your Files Are Ready</h1>
    <p class="delivery-expiry">This link will expire on <strong id="delivery-expiry-date">&mdash;</strong>.</p>
    <div id="delivery-files"></div>
  </div>
  <div id="delivery-error" class="delivery-state" style="display:none">
    <h2>Link Unavailable</h2>
    <p id="delivery-error-text">This link is invalid or has expired. Please contact us if you believe this is a mistake.</p>
  </div>
</main>
<footer style="z-index:1;position:relative;margin-top:2rem">
  <div class="footer-bottom" style="justify-content:center;flex-direction:column;gap:0.5rem;text-align:center;padding-bottom:2rem">
    <p style="color:var(--text-dim);font-size:0.75rem">&copy; 2026 The Ocultt Tarot &middot; All rights reserved</p>
  </div>
</footer>
<script>
(function(){
  // The API base — same pattern as OCULTT_API in js/script.js.
  var API_BASE = window.OCULTT_API_BASE || 'https://ocultt-website.onrender.com/api';

  function qs(name){
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderFile(f){
    var div = document.createElement('div');
    div.className = 'delivery-file';
    var label = document.createElement('p');
    label.className = 'delivery-file-label';
    label.textContent = f.label || '';
    div.appendChild(label);

    if (f.fileType === 'video' || f.fileType === 'audio') {
      var tag = document.createElement(f.fileType === 'audio' ? 'audio' : 'video');
      tag.controls = true;
      tag.src = f.url;
      if (f.fileType === 'video') tag.setAttribute('playsinline', '');
      div.appendChild(tag);
    } else if (f.fileType === 'image') {
      var img = document.createElement('img');
      img.src = f.url;
      img.alt = f.label || 'Image';
      div.appendChild(img);
    } else {
      var a = document.createElement('a');
      a.className = 'doc-link';
      a.href = f.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'View / Download';
      div.appendChild(a);
    }
    return div;
  }

  var token = qs('token');
  var loadingEl = document.getElementById('delivery-loading');
  var contentEl = document.getElementById('delivery-content');
  var errorEl = document.getElementById('delivery-error');

  if (!token) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    return;
  }

  fetch(API_BASE + '/delivery/' + encodeURIComponent(token))
    .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
    .then(function(result){
      loadingEl.style.display = 'none';
      if (!result.ok || !result.data.ok) {
        document.getElementById('delivery-error-text').textContent = (result.data && result.data.error) || 'This link is invalid or has expired.';
        errorEl.style.display = 'block';
        return;
      }
      var data = result.data;
      document.getElementById('delivery-title').textContent = data.title || 'Your Files Are Ready';
      if (data.expiresAt) {
        var d = new Date(data.expiresAt);
        document.getElementById('delivery-expiry-date').textContent = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
      }
      var filesWrap = document.getElementById('delivery-files');
      (data.files || []).forEach(function(f){ filesWrap.appendChild(renderFile(f)); });
      contentEl.style.display = 'block';
    })
    .catch(function(){
      loadingEl.style.display = 'none';
      document.getElementById('delivery-error-text').textContent = 'Something went wrong loading your files. Please try again shortly.';
      errorEl.style.display = 'block';
    });
})();
</script>
</body>
</html>
